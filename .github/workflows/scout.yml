name: Scrape deals & deploy Pages

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      health_test:
        description: "Raise a test problem to check that the health issue opens (the next normal run closes it)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write              # tools/health.py opens/closes the "Site health: needs attention" issue

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Planned end (owner, 2026-11-18): scheduled runs stop after END_DATE. Manual runs and pushes still work.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          END_DATE: "2027-01-17"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" \> "$END_DATE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Past the planned end date ($END_DATE): scheduled runs are off. Manual runs still work." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Logic tests
        id: tests
        run: python tests/test_scoring.py
      - name: Scrape
        id: scrape
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python deal_scout.py | tee scrape.log
      - name: Page smoke test (every tab and control against the fresh data)
        id: smoke
        run: node tests/smoke.js site/index.html
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Deal Scout run"
            echo '```'
            sed -n '/^Kept /,$p' scrape.log 2>/dev/null | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Site health (opens/updates/closes the health issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          HEALTH_TEST: ${{ inputs.health_test && '1' || '' }}
        run: python tools/health.py --issue
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
