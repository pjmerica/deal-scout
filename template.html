<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Scout</title>
<meta name="description" content="The best Black Friday deals, clothing first, ranked by a quality score that shows its reasons. Brand-store sales, Men/Women/Kids filter. Updated every 3 hours.">
<style>
:root{
  --bg:#f6f5f2;--surface:#fff;--surface-2:#efede8;--text:#1b1a17;--muted:#67645e;--line:#e2dfd8;
  --accent:#c2410c;--accent-soft:#fde7d9;--good:#15803d;--good-soft:#dcfce7;--card:#1d4ed8;--card-soft:#dbeafe;
  --warn:#a16207;--warn-soft:#fef3c7;--gold:#a16207;--gold-soft:#fef3c7;--violet:#6d28d9;--violet-soft:#ede9fe;
  --bf:#111;--bf-text:#fff;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211;--surface:#1c1b19;--surface-2:#262522;--text:#f1efe9;--muted:#a19d95;--line:#2f2e2a;
  --accent:#fb923c;--accent-soft:#3b2416;--good:#4ade80;--good-soft:#14301e;--card:#93b4ff;--card-soft:#1b2640;
  --warn:#fbbf24;--warn-soft:#3a2d0c;--gold:#fcd34d;--gold-soft:#3a2d0c;--violet:#c4b5fd;--violet-soft:#2a2342;
  --bf:#f1efe9;--bf-text:#111;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#121211;--surface:#1c1b19;--surface-2:#262522;--text:#f1efe9;--muted:#a19d95;--line:#2f2e2a;
  --accent:#fb923c;--accent-soft:#3b2416;--good:#4ade80;--good-soft:#14301e;--card:#93b4ff;--card-soft:#1b2640;
  --warn:#fbbf24;--warn-soft:#3a2d0c;--gold:#fcd34d;--gold-soft:#3a2d0c;--violet:#c4b5fd;--violet-soft:#2a2342;
  --bf:#f1efe9;--bf-text:#111;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1260px;margin:0 auto;padding:0 16px}
header{padding:26px 0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
h2{font-size:19px;margin:22px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:760px}
.sub a{color:var(--accent)}
.countdown{display:inline-block;margin-top:8px;font-weight:600;font-size:13px;background:var(--bf);color:var(--bf-text);padding:3px 10px;border-radius:999px}
.theme-btn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:16px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
  padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.controls input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:15px}
.controls select,.seg button{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0;cursor:pointer}
.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg .seglabel{align-self:center;font-size:13px;color:var(--muted);margin-right:8px;white-space:nowrap}
.seg .seglabel+button{border-radius:10px 0 0 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:inherit;cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.item.t-Exceptional{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,var(--shadow)}
.item .imgbox{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.item .imgbox img{width:100%;height:100%;object-fit:contain}
.item .body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-size:15px;line-height:1.35;font-weight:600}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:12.5px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.b{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.b.off{background:var(--good-soft);color:var(--good)}
.b.cl{background:var(--accent-soft);color:var(--accent)}
.b.bf{background:var(--bf);color:var(--bf-text)}
.b.new{background:var(--violet-soft);color:var(--violet)}
.b.tier{background:var(--gold-soft);color:var(--gold)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.ends{color:var(--text)}
.b.watch{background:var(--accent-soft);color:var(--accent);font-weight:600}
button.b{border:0;cursor:pointer;font-family:inherit;font-size:11.5px;line-height:inherit}
button.b.watch:hover{text-decoration:underline}
.chips-label{font-size:12.5px;color:var(--muted);align-self:center;margin-right:2px}
.chip small{opacity:.65}
.b.ends.soon{background:var(--warn-soft);color:var(--warn);font-weight:600}
.b.votes{color:var(--text)}
a.b.stack{background:var(--card-soft);color:var(--card);text-decoration:none}
a.b.stack:hover{text-decoration:underline}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.code{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;padding:3px 8px;border-radius:6px;
  border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.promo .code{margin-left:6px;vertical-align:middle}
.pnote{margin:0;font-size:12px;color:var(--muted)}
.grid>.item{content-visibility:auto;contain-intrinsic-size:auto 420px}
.why{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--text)}
.why li{padding-left:14px;position:relative;line-height:1.4}
.why li:before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}
.why li.w:before{content:"!";color:var(--warn)}
.why li.w{color:var(--warn)}
.summary{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.score{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.more{display:block;margin:18px auto 40px;padding:10px 22px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.section-note{color:var(--muted);font-size:14px;margin:0 0 10px}
.catrow{margin:8px 0 18px}
.catrow .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.catrow h3{font-size:16px;margin:16px 0 8px}
/* brand sales */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:40px}
.brand{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.brand h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.promo{background:var(--bf);color:var(--bf-text);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13.5px}
.bstats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bstats b{color:var(--text);font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{text-decoration:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.thumb b{color:var(--text)}
.shop{font-size:14px;font-weight:600;text-decoration:none;color:var(--accent)}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 26px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td small{color:var(--muted)}
.ok{color:var(--good)}.bad{color:var(--accent)}
.method{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:12px 0 24px}
.method div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.method h3{margin:0 0 4px;font-size:15px}
.method p{margin:0;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;padding:14px 0 40px;border-top:1px solid var(--line)}
@media (max-width:560px){
  header{padding-top:16px}.top{flex-wrap:nowrap;gap:10px}.theme-btn{flex:none;padding:4px 8px;font-size:12px}
  .sub{font-size:13.5px}.countdown{margin-top:6px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}.stat{padding:7px 9px;border-radius:10px}
  .stat b{font-size:16px}.stat small{font-size:11px;line-height:1.2;display:block}
  h1{font-size:23px}.item .imgbox{height:130px}.grid,.brands{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>Deal <span>Scout</span></h1>
        <p class="sub">The best Black Friday deals, clothing first. Each deal is ranked by a quality score that shows its reasons. Credit card offers and cash back are on <a id="csLink" href="#">Card Scout</a>. <span id="updated"></span></p>
        <span class="countdown" id="countdown"></span>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">◐ Theme</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>

  <footer>
    Prices and offers change fast, so confirm them before you buy. Clothing deals get a ×<span id="mult"></span> boost.
    Data: <a href="deals.json">deals.json</a> · <a href="deals.csv">deals.csv</a>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;

(function theme(){
  const root=document.documentElement, btn=document.getElementById('themeBtn');
  let saved=null; try{saved=localStorage.getItem('ds-theme')}catch(e){}
  if(saved) root.setAttribute('data-theme',saved);
  btn.onclick=()=>{
    const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const next=cur==='dark'?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('ds-theme',next)}catch(e){}
  };
})();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=(DATA&&DATA.items)||[];
const STACKS=(DATA&&DATA.stacks)||{};
for(const i of items){ // payload omits empty/default fields; restore them once
  for(const k of ['reasons','warnings','gender','brands','clothing_tags','flags','codes','watch','watch_tags']) if(!i[k]) i[k]=[];
  if(!i.sources) i.sources=[i.source];
  if(i.summary==null) i.summary=''; if(i.store==null) i.store=''; if(i.age_days==null) i.age_days=0;
}
const fmtAge=d=>d<1/24?'just now':d<1?Math.round(d*24)+'h ago':Math.round(d)+'d ago';
// Times in the data are UTC to the minute ("2026-11-30T04:59"); end dates are the end of that day in US Eastern.
const utcMs=s=>s?Date.parse(s.length<=16?s+':00Z':s):NaN;
const fmtDay=t=>new Date(t).toLocaleDateString([], {month:'short',day:'numeric'});
const GEN_MS=DATA?Date.parse(DATA.generated):Date.now();
function endInfo(expires){
  const t=utcMs(expires); if(isNaN(t)) return null;
  const now=new Date(), d=new Date(t);
  if(t<now.getTime()) return {txt:'Ended', soon:true, t};
  const days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  const txt=days<=0?'Ends today':days===1?'Ends tomorrow':'Ends '+d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
  return {txt, soon:days<=2, t};
}
const endT=i=>{const t=utcMs(i.expires); return isNaN(t)?Infinity:t;};
// How long it's been up: brand-store markdowns since Deal Scout first saw them, feed deals since they were posted.
function seenInfo(i){
  if(i.source.startsWith('Brand store')){
    const t=utcMs(i.first_seen); if(isNaN(t)) return '';
    const first=DATA.tracking_since&&Math.abs(t-utcMs(DATA.tracking_since))<3600e3;  // already up when tracking began
    const days=Math.floor((Date.now()-t)/864e5);
    const same=/^Same price since/.test(i.price_note||'')?' · same price throughout':'';
    return `On sale since ${first?'at least ':''}${fmtDay(t)}${days>=1?` · ${days} day${days>1?'s':''}`:' · new today'}${same}`;
  }
  if(i.age_days>0.04){const t=GEN_MS-i.age_days*864e5; return `Posted ${fmtDay(t)} · ${fmtAge((Date.now()-t)/864e5)}`;}
  const t=utcMs(i.first_seen); return isNaN(t)?'':`Seen since ${fmtDay(t)}`;
}
const money=v=>v==null?'':'$'+(v>=100?Math.round(v).toLocaleString():(+v).toFixed(2).replace(/\.00$/,''));

function header(){
  if(!DATA) return;
  document.getElementById('updated').textContent='Updated '+new Date(DATA.generated).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})+'.';
  document.getElementById('mult').textContent=DATA.clothing_multiplier;
  const cs=document.getElementById('csLink'); if(cs&&DATA.card_scout_url) cs.href=DATA.card_scout_url;
  const now=new Date(), y=now.getFullYear();
  const nov1=new Date(y,10,1), thanks=new Date(y,10,1+((11-nov1.getDay())%7)+21), bf=new Date(thanks.getTime()+86400000);
  const cm=new Date(bf.getTime()+3*86400000);
  const days=Math.ceil((bf-now)/86400000);
  document.getElementById('countdown').textContent= days>1?`Black Friday in ${days} days (${bf.toLocaleDateString([], {month:'short',day:'numeric'})})`
    : days===1?'Black Friday is tomorrow':(now<=cm?'Black Friday weekend is on':'Holiday sales season');
  const c=DATA.counts;
  document.getElementById('stats').innerHTML=[
    [c.clothing,'clothing deals'],[c.deals,'deals ranked'],[c.brands,'brand stores scanned'],
    [c.brand_items,'brand sale items read'],[c.new,'new since last check'],[`${c.sources_ok}/${c.sources_total}`,'sources online']
  ].map(([v,l])=>`<div class="stat"><b>${v??0}</b><small>${l}</small></div>`).join('');
}

const TABS=[
  {id:'best',label:'🏆 Best'},
  {id:'clothing',label:'👕 Clothing',filter:i=>i.is_clothing&&i.kind==='deal',note:'Clothing and footwear deals ranked by quality score. Filter by category, gender or discount.',clothingChips:true},
  {id:'watch',label:'👀 Watching',filter:i=>i.kind==='deal'&&i.watch.length,note:'Every deal found for the things you watch, wherever it ranks. Pick one to get its own filters (team, console or game, league); the price menu sets a limit.',watchChips:true},
  {id:'brands',label:'🏷 Brand sales'},
  {id:'bf',label:'🖤 Black Friday',filter:i=>i.is_bf,note:'Deals that mention Black Friday, Cyber Monday or doorbusters.',clothingChips:true},
  {id:'all',label:'🔥 All deals',filter:i=>i.kind==='deal',note:'Every deal across categories. Clothing still gets its boost.',catChips:true},
  {id:'roundups',label:'📰 Sale roundups',filter:i=>i.kind==='article',note:'Sale roundups from fashion and deal editors.'},
  {id:'how',label:'⚙️ How it works'},
];
const CLOTH_CATS=['Outerwear','Tops','Bottoms','Dresses & Sets','Footwear','Activewear','Swimwear','Basics & Underwear','Accessories'];
const GENDERS=["Men's","Women's","Kids"];
const WATCH_LABELS=(DATA&&DATA.watch_labels)||[];
const DEAL_CATS=[...new Set(items.filter(i=>i.kind==='deal').map(i=>i.category))].sort();

let state={tab:'best',q:'',sort:'score',cats:new Set(),dcats:new Set(),wcats:new Set(),wsub:new Set(),source:'',minOff:0,maxPrice:0,limit:60,
  bestClothing:false,promoOnly:false,newOnly:false,gender:'all',inclUnlabeled:false};
try{const t=localStorage.getItem('ds-tab'); if(t&&TABS.some(x=>x.id===t)) state.tab=t;}catch(e){}
try{const g=localStorage.getItem('ds-gender'); if(['all',"Men's","Women's",'Kids'].includes(g)) state.gender=g;}catch(e){}

// ---------- gender ("Shopping for") ----------
const G_LABEL={'all':'Everyone',"Men's":'Men',"Women's":'Women','Kids':'Kids'};
// Non-clothing deals are never hidden by the gender switch. "Everyone" = unisex items and storewide sales.
function genderOK(i){
  const sel=state.gender;
  if(sel==='all'||!i.is_clothing) return true;
  const g=i.gender||[];
  if(g.includes(sel)) return true;
  if(sel!=='Kids'&&g.includes('Everyone')) return true;
  return !g.length&&state.inclUnlabeled;
}
function genderSeg(){
  return `<div class="seg" role="group" aria-label="Shopping for"><span class="seglabel">Shopping for</span>${Object.entries(G_LABEL).map(([v,l])=>
    `<button data-g="${esc(v)}" aria-pressed="${state.gender===v}">${l}</button>`).join('')}</div>`;
}
function unlabeledNote(pool){
  if(state.gender==='all'||state.gender==='Kids') return '';
  const n=pool.filter(i=>i.is_clothing&&!(i.gender||[]).length).length;
  if(!n) return '';
  return ` <button class="linkbtn" id="unlab">${state.inclUnlabeled?`Hide ${n} unlabeled`:`+ ${n} clothing deals with no men's/women's label`}</button>`;
}
function bindGender(){
  document.querySelectorAll('.seg button[data-g]').forEach(b=>b.onclick=()=>{
    state.gender=b.dataset.g; state.limit=60; try{localStorage.setItem('ds-gender',state.gender)}catch(e){} render();});
  const u=document.getElementById('unlab'); if(u) u.onclick=()=>{state.inclUnlabeled=!state.inclUnlabeled; render();};
}

// Same rule as scoring.diversify(): at most N per store and per brand, colour variants collapsed.
const titleKey=t=>t.split(/\s[-–|]\s|\s\(/)[0].toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,10).join(' ').slice(0,40);
function diversify(list,n,perStore=1,perBrand=1){
  const out=[],sc={},bc={},keys=new Set();
  for(const it of list){
    const st=(it.store||'').toLowerCase(), br=(it.brands[0]||'').toLowerCase(), k=titleKey(it.title);
    if((st&&(sc[st]||0)>=perStore)||(br&&(bc[br]||0)>=perBrand)||keys.has(k)) continue;
    out.push(it); keys.add(k); if(st) sc[st]=(sc[st]||0)+1; if(br) bc[br]=(bc[br]||0)+1;
    if(out.length>=n) break;
  }
  return out;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>{
    const n=t.filter?items.filter(t.filter).length:'';
    return `<button role="tab" data-tab="${t.id}" aria-selected="${state.tab===t.id}">${t.label}${n!==''?` <small style="opacity:.6">${n}</small>`:''}</button>`;
  }).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    state.tab=b.dataset.tab; state.limit=60; state.q=''; state.cats.clear(); state.dcats.clear(); state.wcats.clear(); state.wsub.clear(); state.source='';
    try{localStorage.setItem('ds-tab',state.tab)}catch(e){}
    renderTabs(); render(); window.scrollTo({top:Math.min(window.scrollY,document.getElementById('tabs').offsetTop)});
  });
}

function itemHTML(i){
  const badges=[];
  if(i.tier&&i.kind==='deal') badges.push(`<span class="b tier">${i.tier==='Exceptional'?'★ ':''}${esc(i.tier)}</span>`);
  if(i.is_new) badges.push(`<span class="b new">NEW</span>`);
  i.watch.forEach(w=>badges.push(`<button class="b watch" data-watch="${esc(w)}" title="See every ${esc(w)} deal">👀 ${esc(w)}</button>`));
  const end=endInfo(i.expires);
  if(end) badges.push(`<span class="b ends${end.soon?' soon':''}" title="From the deal's own listing">⏰ ${esc(end.txt)}</span>`);
  if(i.pct_off) badges.push(`<span class="b off">${i.pct_off}% off</span>`);
  if(i.variants>1) badges.push(`<span class="b" title="Other colours/sizes of this item are also on sale">+${i.variants-1} more colors/sizes</span>`);
  if(i.votes!=null&&i.votes!==0) badges.push(`<span class="b votes">👍 ${i.votes>0?'+':''}${i.votes}</span>`);
  if(i.is_bf) badges.push(`<span class="b bf">Black Friday</span>`);
  if(i.is_clothing) (i.clothing_tags.length?i.clothing_tags:['Clothing']).slice(0,2).forEach(t=>badges.push(`<span class="b cl">${esc(t)}</span>`));
  else if(i.kind==='deal'&&i.category&&i.category!=='Other') badges.push(`<span class="b">${esc(i.category)}</span>`);
  i.gender.slice(0,2).forEach(g=>badges.push(`<span class="b">${g==='Everyone'?'Men &amp; Women':esc(g)}</span>`));
  const st=i.stack&&STACKS[i.stack];
  if(st&&st.rakuten) badges.push(`<a class="b stack" href="${esc(st.rurl)}" target="_blank" rel="noopener" title="Rakuten cash back at ${esc(st.name)} (from Card Scout)">💸 Rakuten ${esc(st.rakuten)}${st.elev?' ↑':''}</a>`);
  if(st&&st.offers) st.offers.slice(0,1).forEach(o=>badges.push(`<a class="b stack" href="${esc(o.link)}" target="_blank" rel="noopener" title="${esc(o.title)}">💳 ${esc(o.label)}</a>`));
  const codes=i.codes.length?`<div class="codes">${i.codes.map(codeBtn).join('')}</div>`:'';
  const seen=seenInfo(i);
  const note=(i.price_note&&!/^Same price since/.test(i.price_note)?`<p class="pnote" title="From Deal Scout's own price history for this item">📈 ${esc(i.price_note)}</p>`:'')
    +(seen?`<p class="pnote" title="Brand-store items: since Deal Scout first saw this markdown. Other deals: when the deal was posted.">🕒 ${esc(seen)}</p>`:'');
  const why=i.reasons.filter(r=>!/^\d+% off$/.test(r)&&!/^Stacks with Rakuten| (?:Offer|Deal|offer|deal) at /.test(r)).slice(0,3).map(r=>`<li>${esc(r)}</li>`).join('')+i.warnings.slice(0,2).map(w=>`<li class="w">${esc(w)}</li>`).join('');
  const price=i.price!=null?`<span class="price">${money(i.price)}${i.orig_price&&i.orig_price>i.price?`<s>${money(i.orig_price)}</s>`:''}</span>`:'';
  const img=i.image?`<div class="imgbox"><img loading="lazy" decoding="async" src="${esc(i.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`:'';
  const src=i.sources.length>1?`${esc(i.source)} +${i.sources.length-1}`:esc(i.source);
  return `<article class="item t-${esc(i.tier||'none')}">${img}<div class="body">
    <h3><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></h3>
    <div class="badges">${badges.join('')}</div>
    ${why?`<ul class="why">${why}</ul>`:(i.summary?`<p class="summary">${esc(i.summary)}</p>`:'')}
    ${codes}${note}
    <div class="row">${price}<span class="meta">${esc(i.store&&!i.source.includes(i.store)?i.store+' · ':'')}${src}</span><span class="score" title="Deal Scout quality score">★ ${Math.round(i.score)}</span></div>
  </div></article>`;
}

function codeBtn(c){return `<button class="code" data-code="${esc(c)}" title="Copy promo code">${esc(c)} <span aria-hidden="true">⧉</span></button>`;}
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('[data-code]'):null; if(!b) return;
  const code=b.dataset.code, done=()=>{const t=b.innerHTML; b.textContent='Copied ✓'; setTimeout(()=>{b.innerHTML=t},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,()=>fallbackCopy(code,done));
  else fallbackCopy(code,done);
});
function fallbackCopy(text,done){const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){} ta.remove();}

function chipRow(list,set,key,counts,prefix){
  return `<div class="chips">${prefix?`<span class="chips-label">${esc(prefix)}</span>`:''}${list.map(x=>`<button class="chip ${set.has(x)?'on':''}" data-k="${key}" data-v="${esc(x)}">${esc(x)}${counts?` <small>${counts[x]||0}</small>`:''}</button>`).join('')}</div>`;
}
function bindChips(main){
  main.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{const s=state[ch.dataset.k]; s.has(ch.dataset.v)?s.delete(ch.dataset.v):s.add(ch.dataset.v);
    if(ch.dataset.k==='wcats') pruneSubs(); state.limit=60; render();});
}
// ---------- Watching: one chip per watched thing (with counts), and its own sub-filters once it's picked ----------
const WATCH_SUBS=(DATA&&DATA.watch_subs)||{};
const watchedItems=()=>items.filter(i=>i.kind==='deal'&&i.watch.length);
function pruneSubs(){  // a sub-filter only applies while its watched thing is picked
  const ok=new Set([...state.wcats].flatMap(w=>WATCH_SUBS[w]||[]));
  for(const s of [...state.wsub]) if(!ok.has(s)) state.wsub.delete(s);
}
function watchChips(){
  const pool=watchedItems(), counts={};
  for(const w of WATCH_LABELS) counts[w]=pool.filter(i=>i.watch.includes(w)).length;
  let h=chipRow(WATCH_LABELS,state.wcats,'wcats',counts);
  for(const w of WATCH_LABELS.filter(w=>state.wcats.has(w)&&WATCH_SUBS[w])){
    const these=pool.filter(i=>i.watch.includes(w)), sc={};
    for(const s of WATCH_SUBS[w]) sc[s]=these.filter(i=>i.watch_tags.includes(s)).length;
    const subs=WATCH_SUBS[w].filter(s=>sc[s]>0);
    if(subs.length>1) h+=chipRow(subs,state.wsub,'wsub',sc,w+':');
  }
  return h;
}
function openWatch(label){
  state.tab='watch'; state.wcats=new Set([label]); state.wsub.clear(); state.limit=60; state.q='';
  try{localStorage.setItem('ds-tab','watch')}catch(e){}
  renderTabs(); render(); const t=document.getElementById('tabs'); if(t&&t.scrollIntoView) t.scrollIntoView({block:'start'});
}
document.addEventListener('click',e=>{const b=e.target&&e.target.closest?e.target.closest('[data-watch]'):null; if(b) openWatch(b.dataset.watch);});
function bindSearch(rerender){
  const qi=document.getElementById('q'); if(!qi) return;
  qi.oninput=e=>{state.q=e.target.value; state.limit=60; const pos=e.target.selectionStart; rerender(); const n=document.getElementById('q'); if(n){n.focus(); n.setSelectionRange(pos,pos);}};
}
const matchQ=(txt)=>!state.q.trim()||txt.toLowerCase().includes(state.q.trim().toLowerCase());

// ---------- tabs ----------
function renderBest(main){
  // items arrive sorted by score, so the diversified pass picks the best of each store/brand.
  const pool=items.filter(i=>i.kind==='deal'&&genderOK(i)&&(!state.newOnly||i.is_new));
  const list=diversify(pool.filter(i=>(!state.bestClothing||i.is_clothing)&&matchQ(i.title+' '+i.store+' '+i.brands.join(' '))),60);
  const cats=[...new Set(pool.map(i=>i.category))].sort((a,b)=>(a==='Clothing & Shoes'?-1:b==='Clothing & Shoes'?1:a.localeCompare(b)));
  const who=state.gender==='all'?'':` for ${G_LABEL[state.gender].toLowerCase()}`;
  main.innerHTML=`<div class="controls">
      <input type="search" id="q" placeholder="Search the best picks…" value="${esc(state.q)}">
      ${genderSeg()}
      <div class="seg" role="group" aria-label="Scope"><button data-v="0" aria-pressed="${!state.bestClothing}">All categories</button><button data-v="1" aria-pressed="${state.bestClothing}">Clothing only</button></div>
      <div class="seg"><button id="newBtn" aria-pressed="${state.newOnly}">New since last check</button></div>
    </div>
    <p class="section-note">The top deals${who} by quality score, one per store and per brand so a single sale can't fill the list. Each card lists why it ranks and any catches.${unlabeledNote(items.filter(i=>i.kind==='deal'))}</p>
    ${list.length?`<div class="grid">${list.map(itemHTML).join('')}</div>`:'<div class="empty">Nothing matches.</div>'}
    <h2>Best in each category${esc(who)}</h2>
    ${cats.map(c=>{const l=diversify(pool.filter(i=>i.category===c),6); return l.length?`<div class="catrow"><h3>${esc(c)}</h3><div class="grid">${l.map(itemHTML).join('')}</div></div>`:''}).join('')}`;
  main.querySelectorAll('.seg button[data-v]').forEach(b=>b.onclick=()=>{state.bestClothing=b.dataset.v==='1';render();});
  document.getElementById('newBtn').onclick=()=>{state.newOnly=!state.newOnly;render();};
  bindSearch(render); bindGender();
}

function renderList(main,tab){
  let list=items.filter(tab.filter);
  const sources=[...new Set(list.map(i=>i.source.replace(/^Slickdeals: .*/,'Slickdeals search').replace(/^Brand store: .*/,'Brand stores')))].sort();
  list=list.filter(i=>matchQ(i.title+' '+i.summary+' '+i.store+' '+i.brands.join(' ')));
  const preGender=list;
  if(state.cats.size) list=list.filter(i=>i.clothing_tags.some(t=>state.cats.has(t)));
  if(state.wcats.size) list=list.filter(i=>i.watch.some(w=>state.wcats.has(w)));
  if(state.wsub.size) list=list.filter(i=>i.watch_tags.some(t=>state.wsub.has(t)));
  if(state.maxPrice) list=list.filter(i=>i.price!=null&&i.price<=state.maxPrice);
  list=list.filter(genderOK);
  if(state.dcats.size) list=list.filter(i=>state.dcats.has(i.category));
  if(state.source) list=list.filter(i=>i.source===state.source||(state.source==='Slickdeals search'&&i.source.startsWith('Slickdeals: '))||(state.source==='Brand stores'&&i.source.startsWith('Brand store: ')));
  if(state.minOff) list=list.filter(i=>(i.pct_off||0)>=state.minOff);
  if(state.newOnly) list=list.filter(i=>i.is_new);
  const sorters={score:(a,b)=>b.score-a.score,off:(a,b)=>(b.pct_off||0)-(a.pct_off||0)||b.score-a.score,
    votes:(a,b)=>(b.votes??-1e9)-(a.votes??-1e9),new:(a,b)=>a.age_days-b.age_days,
    ends:(a,b)=>endT(a)-endT(b)||b.score-a.score,
    price:(a,b)=>(a.price??1e9)-(b.price??1e9),saved:(a,b)=>(b.saved||0)-(a.saved||0)};
  list.sort(sorters[state.sort]||sorters.score);
  main.innerHTML=`<div class="controls">
    <input type="search" id="q" placeholder="Search brands, items, stores…" value="${esc(state.q)}">
    <select id="sort" aria-label="Sort"><option value="score">Best score</option><option value="off">Biggest % off</option><option value="saved">Most $ saved</option><option value="votes">Most votes</option><option value="new">Newest</option><option value="ends">Ending soonest</option><option value="price">Lowest price</option></select>
    <select id="minOff" aria-label="Minimum discount"><option value="0">Any discount</option><option value="30">30%+ off</option><option value="50">50%+ off</option><option value="70">70%+ off</option></select>
    <select id="maxPrice" aria-label="Maximum price"><option value="0">Any price</option><option value="25">Under $25</option><option value="50">Under $50</option><option value="100">Under $100</option><option value="200">Under $200</option></select>
    <select id="source" aria-label="Source"><option value="">All sources</option>${sources.map(s=>`<option ${state.source===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <div class="seg"><button id="newBtn" aria-pressed="${state.newOnly}">New only</button></div>
    ${genderSeg()}
  </div>
  ${tab.clothingChips?chipRow(CLOTH_CATS,state.cats,'cats'):''}
  ${tab.catChips?chipRow(DEAL_CATS,state.dcats,'dcats'):''}
  ${tab.watchChips?watchChips():''}
  <p class="section-note">${esc(tab.note)}${state.sort==='ends'?` ${list.filter(i=>endT(i)<Infinity).length} of these state when they end; they come first, the rest follow by score.`:''} Showing ${Math.min(list.length,state.limit)} of ${list.length}${state.gender!=='all'?` for ${G_LABEL[state.gender].toLowerCase()}${tab.id==='all'||tab.id==='bf'?' (non-clothing deals always shown)':''}`:''}.${unlabeledNote(preGender)}</p>
  ${list.length?`<div class="grid">${list.slice(0,state.limit).map(itemHTML).join('')}</div>`:'<div class="empty">Nothing matches these filters.</div>'}
  ${list.length>state.limit?`<button class="more" id="more">Show more (${list.length-state.limit} left)</button>`:''}`;
  document.getElementById('sort').value=state.sort;
  document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
  const mo=document.getElementById('minOff'); mo.value=state.minOff; mo.onchange=e=>{state.minOff=+e.target.value;render();};
  const mp=document.getElementById('maxPrice'); mp.value=state.maxPrice; mp.onchange=e=>{state.maxPrice=+e.target.value;state.limit=60;render();};
  document.getElementById('source').onchange=e=>{state.source=e.target.value;render();};
  document.getElementById('newBtn').onclick=()=>{state.newOnly=!state.newOnly;render();};
  const more=document.getElementById('more'); if(more) more.onclick=()=>{state.limit+=60;render();};
  bindChips(main); bindSearch(render); bindGender();
}

// Brand-level gender: a brand matches if it has sale items for that audience (or sells to everyone).
function brandFor(s){
  const sel=state.gender; if(sel==='all') return true;
  const a=s.audience||{};
  if((a[sel]||0)>0) return true;
  if(sel!=='Kids'&&(a.Everyone||0)>0) return true;
  if(!s.on_sale) return s.brand_audience===sel||(sel!=='Kids'&&s.brand_audience==='Everyone');
  return false;
}
function topFor(s){
  const sel=state.gender;
  return (s.top||[]).filter(t=>sel==='all'||(t.gender||[]).includes(sel)||(sel!=='Kids'&&(t.gender||[]).includes('Everyone')));
}
function countFor(s){
  const a=s.audience||{}, sel=state.gender;
  if(sel==='all'||!s.audience) return s.on_sale;
  return (a[sel]||0)+(sel!=='Kids'?(a.Everyone||0):0);
}

function renderBrands(main){
  let list=DATA.brand_sales.filter(s=>s.on_sale>0||s.promo).filter(brandFor);
  if(state.promoOnly) list=list.filter(s=>s.promo);
  list=list.filter(s=>matchQ(s.store+' '+s.promo+' '+s.top.map(t=>t.title).join(' ')));
  const quiet=DATA.brand_sales.filter(s=>!(s.on_sale>0||s.promo)).map(s=>s.store);
  main.innerHTML=`<div class="controls">
      <input type="search" id="q" placeholder="Search brands or items…" value="${esc(state.q)}">
      ${genderSeg()}
      <div class="seg"><button id="promoBtn" aria-pressed="${state.promoOnly}">Live sitewide promo only</button></div>
    </div>
    <p class="section-note">Read straight from each brand's own store: live sale prices against the original price, in-stock items only, and the promo shown in the homepage banner. Brands are ranked by how strong the sale is compared with how often that brand usually discounts.</p>
    <div class="brands">${list.map(s=>`<div class="brand">
      <h3>${esc(s.store)} ${s.baseline<=15?'<span class="b tier">Rarely discounts</span>':''} ${s.promo_new?'<span class="b new">NEW promo</span>':''}</h3>
      ${s.promo?`<div class="promo">${esc(s.promo)}${s.promo_code?` ${codeBtn(s.promo_code)}`:''}${(()=>{const e=endInfo(s.promo_ends); return e?` <span class="b ends${e.soon?' soon':''}">⏰ ${esc(e.txt)}</span>`:'';})()}</div>`:''}
      ${(()=>{const st=s.stack&&STACKS[s.stack]; if(!st) return ''; const parts=[];
        if(st.rakuten) parts.push(`<a class="b stack" href="${esc(st.rurl)}" target="_blank" rel="noopener">💸 Rakuten ${esc(st.rakuten)}${st.elev?' ↑':''}</a>`);
        (st.offers||[]).slice(0,2).forEach(o=>parts.push(`<a class="b stack" href="${esc(o.link)}" target="_blank" rel="noopener" title="${esc(o.title)}">💳 ${esc(o.label)}</a>`));
        return parts.length?`<div class="badges">${parts.join('')}</div>`:'';})()}
      <div class="bstats">${s.on_sale?`<span><b>${countFor(s)}</b> ${state.gender==='all'?'':esc(G_LABEL[state.gender].toLowerCase())+'\'s '}items on sale</span><span>typical <b>${s.median_pct}%</b> off</span><span>up to <b>${s.max_pct}%</b></span>`:'<span>Sale items not readable right now</span>'}</div>
      ${topFor(s).length?`<div class="thumbs">${topFor(s).slice(0,3).map(t=>`<a class="thumb" href="${esc(t.link)}" target="_blank" rel="noopener">${t.image?`<img loading="lazy" src="${esc(t.image)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`:''}<span>${esc(t.title.slice(0,46))}</span><span><b>${money(t.price)}</b> <s>${money(t.orig)}</s> · ${t.pct}%</span></a>`).join('')}</div>`:''}
      <a class="shop" href="${esc(s.url)}" target="_blank" rel="noopener">Shop the sale →</a>
    </div>`).join('')||'<div class="empty">Nothing matches.</div>'}</div>
    ${quiet.length?`<p class="section-note">No sale found right now: ${esc(quiet.join(', '))}.</p>`:''}`;
  document.getElementById('promoBtn').onclick=()=>{state.promoOnly=!state.promoOnly;render();};
  bindSearch(render); bindGender();
}

function renderHow(main){
  const M=[
    ['Effective discount','Stacked codes compound: 50% off plus an extra 30% off is about 65% off. "Up to" offers are discounted, and BOGO counts as 50%. Prices are read from the title, the description or the retailer.'],
    ['Discount vs. the brand\'s usual sale','Each brand has a normal everyday sale level. Old Navy runs 50% off most weeks, while Patagonia or Arc\'teryx rarely go past 10%. The amount by which a deal beats that level ("excess discount") scores extra.'],
    ['Price-history evidence','Phrases like "best price we could find by $X", "all-time low" and "price mistake", camelcamelcamel price drops, and Deal Scout\'s own record: a price below anything seen on earlier checks.'],
    ['Community validation','Slickdeals thumbs on a log scale, how fast votes are coming in, and placement on Slickdeals Frontpage or Popular.'],
    ['Editor validation','DealNews staff picks. Deals found independently by several sources get a bump.'],
    ['Quality & stock','Premium brands that rarely discount score higher. Brand-store prices are read from the retailer itself, and items with few sizes left score lower.'],
    ['Catches','Scores drop for in-store only or YMMV, membership required, refurbished, rebates, sponsored posts and "sold out" or "expired" signals. These are shown in amber on each deal.'],
    ['Freshness','Scores halve every 5 days. There\'s a small bump when a deal ends soon, and expired deals are removed.'],
    ['End dates and timing','Few deals say when they end. When one does ("Ends 12/1", "through November 30", "11/22-11/27", "today only", "ends Cyber Monday"), or DealNews gives an expiry, the card shows ⏰ and the "Ending soonest" sort puts it first. "Today" and weekdays count from the day the deal was posted, and a date wins over relative words. Each card also says how long it has been up: when it was posted, or for brand-store items, when Deal Scout first saw the markdown. Items already up when tracking began on Nov 18 say "since at least". From that history, about two-thirds of deals drop out of the feeds within a day and over 90% within five days, though dropping out doesn\'t always mean the sale ended.'],
    ['Fake-sale detector','Deal Scout records every brand-store item\'s price and "original" price on each run. If the original price was raised after we first saw it (inflate-then-discount), or the item was cheaper at some point in the last 14 days, the deal gets an amber warning and a lower score. Each item also shows its tracked price range.'],
    ['Promo codes','Codes are pulled from deal text ("use promo code EARLYBF", "w/ code BFCM26") and from brands\' homepage banners. Tap a code to copy it.'],
    ['Stack hints','Rakuten cash back and recent card-linked offers (Amex, Chase, Capital One…) at the same store come from the companion site Card Scout. They show as 💸 and 💳 badges and add a small score bonus.'],
    ['Clothing bias',`Clothing scores are multiplied by ${DATA.clothing_multiplier} with a flat bonus added. Tiers are percentiles: Exceptional is the top 3%, Great the top 12%, Good the top 35%.`],
  ];
  const s=[...DATA.sources].sort((a,b)=>b.ok-a.ok||b.count-a.count);
  main.innerHTML=`<h2>How the score works</h2><div class="method">${M.map(([t,p])=>`<div><h3>${esc(t)}</h3><p>${esc(p)}</p></div>`).join('')}</div>
    <h2>Sources (${DATA.counts.sources_ok}/${DATA.counts.sources_total} online)</h2>
    <p class="section-note">Reddit needs free API keys (see the README). Brand stores that throttle a run are retried on the next one, every 3 hours.</p>
    <div class="tblwrap"><table><thead><tr><th>Source</th><th>Type</th><th>Status</th><th class="n">Items</th></tr></thead><tbody>
    ${s.map(x=>`<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a></td><td>${esc(x.kind)}</td><td class="${x.ok?'ok':'bad'}">${x.ok?'online':'unavailable'}</td><td class="n">${x.count}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function render(){
  const main=document.getElementById('main'), tab=TABS.find(t=>t.id===state.tab);
  const fn={best:renderBest,brands:renderBrands,how:renderHow}[tab.id];
  if(fn) fn(main); else renderList(main,tab);
}

if(!DATA){document.getElementById('main').innerHTML='<div class="empty">No data yet. Run deal_scout.py.</div>';}
else {header(); renderTabs(); render();}
</script>
